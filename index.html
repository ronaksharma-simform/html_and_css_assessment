<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart - Online Shopping Site for Mobiles, Electronics, Furniture, Grocery & More</title>
    <link rel="shortcut icon" href="https://static-assets-web.flixcart.com/www/promos/new/20150528-140547-favicon-retina.ico"/>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <!-- Header Section Starts-->
    <header>
        <div class="header-left">
            <div class="icon">
                <div class="icon-top">
                    <img src="./images/flipkart-plus_8d85f4.png" id="flipkart-icon" alt="Flipkart Icon">
                </div>
                <div class="icon-bottom">
                    <span>Explore</span>
                    <span> <span class="plus-text">Plus</span> <img id="plus-icon" src="./images/plus.png"
                    alt="Plus icon"></span>
                </div>
            </div>
            <div class="search-bar">
                <input type="text" placeholder="Search for products, brands, and more">
                
                <!-- <img src="images/search.png" alt="Search icon" class="search-icon"> -->
                <i class='fas fa-search search-icon'></i>
            </div>
        </div>
        <div class="header-right">
            
            <button class="login-button">Login</button>
            <div class="drop-down-nav">
                <select name="nav-select" id="nav-select">
                    <option value="More">More</option>
                </select>
            </div>
            <div class="cart">
                <i class="fa fa-shopping-cart cart-icon"></i> Cart
            </div>
        </div>
    </header>
    <!-- Header Section Ends-->
    <!-- Category Section  Starts  -->

    <section class="category">
        <div class="category-container">
            <div class="category-item">
                <img class="category-item-image" src="https://rukminim1.flixcart.com/fk-p-flap/64/64/image/e00302d428f5c7be.png?q=100" alt="Minutes">
                <div class="category-item-text">Minutes</div>
            </div>
            <div class="category-item">
                <img class="category-item-image" src="https://rukminim2.flixcart.com/fk-p-flap/128/128/image/5f2ee7f883cdb774.png?q=100" alt="Mobiles and Tablets">
                <div class="category-item-text">Mobiles and Tablets</div>
            </div>
            <div class="category-item">
                <img class="category-item-image" src="https://rukminim1.flixcart.com/flap/128/128/image/29327f40e9c4d26b.png?q=100" alt="Grocery Items">
                <div class="category-item-text">Grocery</div>
            </div>
               <div class="category-item">
                <img class="category-item-image" src="https://rukminim1.flixcart.com/flap/128/128/image/dff3f7adcf3a90c6.png?q=100" alt="Beauty,Toys and more">
                <div class="category-item-text"><select name="category-select" id="category-select" ><option value="Beauty, Toys and more">Beauty, Toys and more</option></select></div>
            </div>
            <div class="category-item">
                <img class="category-item-image" src="https://rukminim2.flixcart.com/fk-p-flap/128/128/image/ff559cb9d803d424.png?q=100" alt="Fashion">
                <select name="category-select" id="category-select" >
                    <option value="Fashion">Fashion</option>
                </select>
            </div>
              <div class="category-item">
                <img class="category-item-image" src="https://rukminim2.flixcart.com/fk-p-flap/128/128/image/1788f177649e6991.png?q=100" alt="Home & Furniture">
                <div class="category-item-text">
                  <select name="category-select" id="category-select" >
                        <option value="Home & Furniture">Home & Furniture</option>
                    </select>  
                </div>
            </div>
            <div class="category-item">
                <img class="category-item-image" src="https://rukminim2.flixcart.com/fk-p-flap/128/128/image/af646c36d74c4be9.png?q=100" alt="Electronics">
                <div class="category-item-text">
                    <select name="category-select" id="category-select" >
                        <option value="Electronics">Electronics</option>
                    </select>
                </div>
            </div>
          
            <div class="category-item">
                <img class="category-item-image" src="https://rukminim2.flixcart.com/fk-p-flap/128/128/image/3c647c2e0d937dc5.png?q=100" alt="Flight Bookings">
                <div class="category-item-text">Flight Bookings</div>
            </div>
         
            <div class="category-item">
                <img class="category-item-image" src="https://rukminim1.flixcart.com/flap/128/128/image/0ff199d1bd27eb98.png?q=100" alt="TVs & Appliances">
                <div class="category-item-text">
                    <select name="category-select" id="category-select" >
                        <option value="TVs & Appliances">TVs & Appliances</option>
                    </select>
                </div>
            </div>
        </div>
    </section>
      <!-- Category Section  Ends -->
</body>

</html>
